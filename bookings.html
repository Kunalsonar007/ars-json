<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Airline Reservation Form</title>
  <link rel="stylesheet" href="./Styles/bookings.css">
</head>

<body onload="logincredentialscheck()">

  <form id="booking-form">
    <h1>Airline Reservation Form</h1>

    <label for="departure-city">Departure City:</label>
    <input type="text" id="departure-city" name="departure-city" disabled><br>

    <label for="arrival-city">Arrival City:</label>
    <input type="text" id="arrival-city" name="arrival-city" disabled><br>

    <label for="departure-date">Departure Date:</label>
    <input type="date" id="departure-date" name="departure-date"><br>

    <label for="flight-number">Flight Number:</label>
    <input type="text" id="flight-number" name="flight-number" disabled><br>

    <label for="adults">Number of Adults:</label>
    <input type="number" id="adults" name="adults" min="1" max="10" value="1" required><br>

    <label for="children">Number of Children:</label>
    <input type="number" id="children" name="children" min="0" max="10" value="0"><br>

    <h2 class="">Passenger Information:</h2>
    <div id="passenger-info">
      <!-- Dynamic passenger fields here -->
    </div>

    <input type="button" id="add-passenger" value="Add Passengers">
    <input type="submit" value="Book Flight">
    <a href="dashboardCustomer.html" class="btn-close">Close</a>
  </form>

  <div id="ticket-container-main" style="display: none;">
    <div id="ticket-container"></div>
    <a href="dashboardCustomer.html" class="btn-close hide-btn">Close</a>
  </div>

  <script src="./JS/bookings.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Profile</title>
  <link rel="stylesheet" href="./Styles/updateCustomerData.css" />
  <link href="https://fonts.cdnfonts.com/css/lufga" rel="stylesheet" />
</head>

<body onload="populateForm()">
  <div class="container">
    <header>
      <nav class="nav-right">
        <ul>
          <li><a href="./flightSearch.html">Flights</a></li>
          <li><a href="booking.html">History</a></li>
          <li><a href="./passengers.html">Passengers</a></li>
          <li><a href="./updateCustomerData.html">Update Profile</a></li>
          <li><a href="./index.html" onclick="logout()">Logout</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <form id="update-form">
        <label for="name">Name:</label>
        <input type="text" id="name" required /><br /><br />
        <label for="email">Email:</label>
        <input type="email" id="email" required /><br /><br />
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" required /><br /><br />
        <label for="address">Address:</label>
        <input type="text" id="address" required /><br /><br />
        <label for="password">Password:</label>
        <input type="password" id="password" required /><br /><br />
        <input type="hidden" id="id" />
        <button type="submit">Update</button>
      </form>

      <p id="status-msg" style="color: green; font-weight: bold;"></p>
    </main>
  </div>

  <script>
    function populateForm() {
      const loginInfo = JSON.parse(localStorage.getItem("logininfo"));
      if (!loginInfo) {
        alert("No login info found. Please log in again.");
        window.location.href = "./index.html";
        return;
      }

      document.getElementById("id").value = loginInfo.id;
      document.getElementById("name").value = loginInfo.name;
      document.getElementById("email").value = loginInfo.email;
      document.getElementById("phone").value = loginInfo.phone;
      document.getElementById("address").value = loginInfo.address;
      document.getElementById("password").value = loginInfo.password;
    }

    function logout() {
      localStorage.removeItem("logininfo");
      window.location.href = "./index.html";
    }

    document.getElementById("update-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const updatedData = {
        id: document.getElementById("id").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        password: document.getElementById("password").value,
      };

      localStorage.setItem("logininfo", JSON.stringify(updatedData));

      const userId = updatedData.id;

      fetch(`http://localhost:3000/customers/${userId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(updatedData),
        })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP error ${response.status}`);
          }
          return response.json();
        })
        .then((data) => {
          console.log("Server response:", data);
          alert("Profile updated successfully!");
        })
        .catch((error) => {
          console.error("Error updating profile:", error);
          alert("Failed to update profile. " + error.message);
        });
    });
  </script>
</body>

</html>
